# Web + API + PostgreSQL del CV para el NAS. Está pensado para pegarse tal cual en el editor de "Compose config" del NAS:
# sin archivo .env ni variables externas. Cambia los valores marcados con CAMBIA.
# Túnel de Cloudflare (manual): floreslab.dev -> http://cv-web:3000. Este compose no publica puertos de la API: cv-web la llama por la red interna.
# Si además la expones por el túnel (cv-api.floreslab.dev), bloquea /api/v1/admin/* en Cloudflare ANTES de desplegar el admin (docs/admin-runbook.md en el repo `cv`).
services:
  cv-db:
    image: postgres:16-alpine
    container_name: cv-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cv
      POSTGRES_USER: cv
      POSTGRES_PASSWORD: CAMBIA-esta-contrasena
    volumes:
      - cv-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cv -d cv"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Rotación de los logs de Docker: 5 archivos de 10 MB como máximo por contenedor (50 MB). Sin esto json-file crece sin límite en el NAS.
    # Postgres escribe poco al log; se limita igual para que ningún servicio quede fuera de la regla.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Sin "ports": solo la API (misma red del compose) llega a la base de datos.

  cv-api:
    image: julioflores781/cv-api:latest
    container_name: cv-api
    restart: unless-stopped
    depends_on:
      cv-db:
        condition: service_healthy
    # Sin "ports": la web (misma red del compose) llega a http://cv-api:8080.
    # Si prefieres acceder por IP y puerto del NAS, descomenta:
    # ports:
    #   - "8085:8080"
    networks: [default, padelhub]
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://cv-db:5432/cv
      QUARKUS_DATASOURCE_USERNAME: cv
      QUARKUS_DATASOURCE_PASSWORD: CAMBIA-esta-contrasena # la misma que POSTGRES_PASSWORD
      # Formulario de contacto. La sal hashea la IP del remitente: pon una cadena larga y secreta propia.
      CV_CONTACT_IP_SALT: CAMBIA-por-una-cadena-larga-y-secreta
      # Aviso por Telegram de cada mensaje nuevo (bot de @BotFather y el id de tu chat). Vacío = sin aviso, los mensajes se guardan igual.
      CV_CONTACT_TELEGRAM_BOT_TOKEN: ""
      CV_CONTACT_TELEGRAM_CHAT_ID: ""
      # ── Administración del contenido (el panel de la fase 3 y /api/v1/admin) ──
      # Secreto con el que se firman las sesiones (JWT HS256): genéralo con `openssl rand -base64 48`. Mínimo 32 caracteres.
      # Si falta o es corto (el marcador de abajo lo es), la API arranca igual, la parte pública funciona y /api/v1/admin responde 404 (admin deshabilitado).
      # Cambiarlo cierra todas las sesiones abiertas. La contraseña NO va aquí: se crea en el NAS con scripts/admin-password.sh del repo `cv`.
      CV_ADMIN_JWT_SECRET: CAMBIA-por-32-bytes-aleatorios # a propósito de menos de 32 caracteres: sin cambiarlo, el admin queda deshabilitado
      CV_ADMIN_SESSION_LIFESPAN: PT8H # duración de la sesión (ISO-8601)
      CV_ADMIN_LOGIN_MAX_FAILURES: "5" # fallos seguidos que bloquean la cuenta
      CV_ADMIN_LOGIN_LOCK: PT15M # cuánto dura el bloqueo
      # OBLIGATORIO en "true": responde 404 a toda petición de /api/v1/admin que traiga cabeceras de Cloudflare (CF-Ray, CF-Connecting-IP),
      # es decir, a todo lo que llegue por el túnel. cv-web llama por la red interna y no las lleva. Es defensa en profundidad: la regla
      # de Cloudflare que bloquea /api/v1/admin/* sigue siendo necesaria (ver docs/admin-runbook.md del repo `cv`).
      CV_ADMIN_EDGE_BLOCK: "true"
      # Argon2id de la contraseña (por defecto 64 MiB, 3 iteraciones, 1 hilo). No hace falta tocarlo; si el login va lento en el NAS,
      # mide y ajusta con estas variables (descomenta): se aplican a los hashes nuevos, los antiguos siguen valiendo.
      # CV_ADMIN_ARGON2_MEMORY_KIB: "65536"
      # CV_ADMIN_ARGON2_ITERATIONS: "3"
      # CV_ADMIN_ARGON2_PARALLELISM: "1"
      # Imágenes de proyectos en Cloudflare R2 (claves site/projects/<uuid>.<ext>). Las cuatro primeras vacías = subida deshabilitada
      # (503 IMAGE_STORAGE_UNAVAILABLE); el resto de la API no se entera. Usa un token de R2 PROPIO de esta web (lectura y escritura
      # solo sobre este bucket), distinto del de padelhub, para poder rotarlo sin afectarle.
      R2_ENDPOINT: https://CAMBIA-account-id.r2.cloudflarestorage.com
      R2_BUCKET_NAME: CAMBIA-bucket
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      # Dominio público del bucket, sin barra final (de aquí salen las images[].url de /api/v1/projects). Vacío = el GET público no devuelve imágenes.
      R2_PUBLIC_URL: ""
    # Sin límite de memoria a propósito (la JVM usa hasta el 75 % de la que haya). Argon2 necesita 64 MiB por hash (hasta 2 a la vez) más la subida
    # de imágenes y, al ejecutar admin-password.sh, una segunda JVM dentro del mismo contenedor. Si le pones "mem_limit", que sea de 512m o más.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/q/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Rotación de los logs de Docker: 5 archivos de 10 MB como máximo por contenedor (50 MB). Sin esto json-file crece sin límite en el NAS.
    # Aquí viven el access log y la auditoría de la API (docs/observability.md del repo `cv`): al rotar, los más antiguos se pierden (no hay tabla de auditoría).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  cv-web:
    image: julioflores781/cv-web:latest
    container_name: cv-web
    restart: unless-stopped
    depends_on:
      cv-api:
        condition: service_healthy
    # Sin "ports": el túnel (cloudflared de padelhub, en la red padelhub_default) llega a http://cv-web:3000.
    # Si prefieres acceder por IP y puerto del NAS, descomenta:
    # ports:
    #   - "3000:3000"
    networks: [default, padelhub]
    environment:
      # La web lee la API en cada render por la red interna; no hay secretos propios de la web.
      CV_API_URL: http://cv-api:8080
      # Origen público: canonical, hreflang, sitemap, robots, Open Graph y JSON-LD.
      SITE_URL: https://floreslab.dev
    healthcheck:
      # Comprueba también la API (/api/health/ responde 503 si ella no contesta).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Rotación de los logs de Docker: 5 archivos de 10 MB como máximo por contenedor (50 MB). Sin esto json-file crece sin límite en el NAS.
    # Una línea JSON por evento (lib/log.ts); lee y cruza por request_id con cv-api.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  cv-db:

networks:
  # Red de los contenedores de padelhub (donde viven sus cloudflared). Debe existir antes de desplegar este stack.
  # cv-db NO se une a ella: solo cv-api y cv-web.
  padelhub:
    external: true
    name: padelhub_default
